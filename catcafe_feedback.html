<body>
    <section>
        <div class="form-box">
            <div class="form-value">
                <h2>Feedback Form</h2>
                <form action="">
                    <div class="inputbox">
                     <input type= "name" required>
                     <label for="">Your Name:</label>
                    </div>
                    <div class="inputbox">
                     <input type="email" required>
                     <label for="">Email:</label>
                    </div>
                    <div class="inputbox">
                     <input type="no.tel" required>
                     <label for="">No.Tel:</label>
                    </div> 
                    <div class="formRow">
                        <label>SERVICE</label>
                        <fieldset class="optGroup">
                            <label for="fExcellent">Excellent</label>
                            <input name="sService" id="fExcellent" value="excellent" type="radio"/>
                            <label for="fGood">Good</label>
                            <input name="sService" id="fGood" value="good" type="radio"/>
                            <label for="fFair">Fair</label>
                            <input name="sService" id="fFair" value="fair" type="radio"/>
                            <label for="fPoor">Poor</label>
                            <input name="sService" id="fPoor" value="poor" type="radio"/>
                        </fieldset>
                    </div>
                    <div class="formRow">
                        <label>CLEANLINESS</label>
                        <fieldset class="optGroup">
                            <label for="fExcellent">Excellent</label>
                            <input name="sCleanliness" id="fExcellent" value="excellent" type="radio"/>
                            <label for="fGood">Good</label>
                            <input name="sCleanliness" id="fGood" value="good" type="radio"/>
                            <label for="fFair">Fair</label>
                            <input name="sCleanliness" id="fFair" value="fair" type="radio"/>
                            <label for="fPoor">Poor</label>
                            <input name="sCleanliness" id="fPoor" value="poor" type="radio"/>
                        </fieldset>
                    </div>
                    <div class="formRow">
                        <label>FOOD</label>
                        <fieldset class="optGroup">
                            <label for="fExcellent">Excellent</label>
                            <input name="sFood" id="fExcellent" value="excellent" type="radio"/>
                            <label for="fGood">Good</label>
                            <input name="sFood" id="fGood" value="good" type="radio"/>
                            <label for="fFair">Fair</label>
                            <input name="sFood" id="fFair" value="fair" type="radio"/>
                            <label for="fPoor">Poor</label>
                            <input name="sFood" id="fPoor" value="poor" type="radio"/>
                        </fieldset>
                    </div>
                    <div class="formRow">
                        <label>DRINK</label>
                        <fieldset class="optGroup">
                            <label for="fExcellent">Excellent</label>
                            <input name="sDrink" id="fExcellent" value="excellent" type="radio"/>

                            <input name="sDrink" id="fGood" value="good" type="radio"/>

                        <fieldset class="optGroup">
                            <label for="fExcellent">Excellent</label>
                            <input name="sambience" id="fExcellent" value="excellent" type="radio"/>
                            <label for="fGood">Good</label>
                            <input name="sambience" id="fGood" value="good" type="radio"/>

                            <input name="sambience" id="fFair" value="fair" type="radio"/>
                            <label for="fPoor">Poor</label>
                            <input name="sambience" id="fPoor" value="poor" type="radio"/>
                        </fieldset>
                    </div>
                    <div class="inputbox">
                    <p>COMMENTS OR SUGGESTIONS FOR US:</p>

                        <textarea name="custExp" id="commBox"></textarea>
                       </div>
